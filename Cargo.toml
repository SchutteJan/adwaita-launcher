[package]
name = "adwaita-launcher"
version = "0.1.0"
edition = "2024"
authors = ["Jan Schutte <4732389+SchutteJan@users.noreply.github.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/SchutteJan/adwaita-launcher"
categories = ["gui"]
keywords = ["launcher", "app-launcher", "pop-launcher", "adwaita-launcher"]
description = "An application launcher for GNOME, based on pop-launcher and built with libadwaita"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
gio-unix = "0.22"
pop-launcher = { git = "https://github.com/pop-os/launcher/", version = "1.2.7" }
serde_json = "1"
